name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify committed runtime manifest
        run: python3 -B maintenance/package.py verify
      - name: Check planner behavior
        run: python3 -B maintenance/check-planner.py
      - name: Check packaging and reviewed-commit export
        run: python3 -B maintenance/check-package.py
      - name: Check deterministic runtime archive
        run: |
          python3 -B maintenance/package.py archive
          cp dist/srstack-0.1.0.zip "${RUNNER_TEMP}/srstack-first.zip"
          python3 -B maintenance/package.py archive
          cmp "${RUNNER_TEMP}/srstack-first.zip" dist/srstack-0.1.0.zip
